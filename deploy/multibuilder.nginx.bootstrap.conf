server {
    listen 80;
    listen [::]:80;
    server_name multibuilder.grabo.tools;

    access_log /var/log/nginx/multibuilder.access.log;
    error_log /var/log/nginx/multibuilder.error.log;
    default_type text/plain;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503 "MultiBuilder deployment is not ready\n";
    }
}
