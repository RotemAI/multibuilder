server {
    listen 80;
    listen [::]:80;
    server_name multibuilder.grabo.tools;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name multibuilder.grabo.tools;

    ssl_certificate /etc/letsencrypt/live/multibuilder.grabo.tools/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/multibuilder.grabo.tools/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/multibuilder.access.log;
    error_log /var/log/nginx/multibuilder.error.log;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8510;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
